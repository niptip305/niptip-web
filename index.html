<!doctype html>
<html lang="en" data-theme="baddie">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070509">
<title>NipTips</title>
<meta name="description" content="Tap in. Light her up. Tips go straight to her.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  [data-theme="baddie"] { --bg:#070509; --top:#2a0714; --glass:rgba(20,10,16,.6); --line:rgba(255,120,170,.2); --text:#f7eef3; --muted:#a08a98; --a1:#ff2d7a; --a2:#e3122f; --a3:#8f3dff; --shadow:rgba(0,0,0,.55); color-scheme:dark; }
  [data-theme="girly"]  { --bg:#fdeef4; --top:#ffd9ea; --glass:rgba(255,255,255,.65); --line:rgba(255,255,255,.95); --text:#3a1a37; --muted:#8a6687; --a1:#ff4f9e; --a2:#ff7ab8; --a3:#b77bff; --shadow:rgba(170,90,160,.2); color-scheme:light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { min-height:100vh; background:radial-gradient(120% 60% at 50% -10%, var(--top), var(--bg) 60%) var(--bg) fixed; color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; }
  main { max-width:460px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); position:relative; z-index:1; }
  .grad { background:linear-gradient(118deg,var(--a2),var(--a1) 48%,var(--a3)); }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .brand { font-weight:900; letter-spacing:.06em; font-size:18px; color:var(--a1); text-shadow:0 0 16px var(--a1); }
  .sw { border:1px solid var(--line); background:var(--glass); color:var(--text); border-radius:99px; padding:7px 12px; font-size:12.5px; font-weight:700; }
  .banner { height:150px; margin:0 -18px; background-size:cover; background-position:center; -webkit-mask-image:linear-gradient(#000 55%,transparent); mask-image:linear-gradient(#000 55%,transparent); }
  .hero { text-align:center; margin-top:-64px; }
  .ring { width:124px; height:124px; border-radius:50%; padding:3px; margin:0 auto; box-shadow:0 0 22px var(--a1),0 0 46px var(--a3); position:relative; }
  .ring::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--a1); opacity:0; animation:pulse 2.6s ease-out infinite; }
  @keyframes pulse { 0% { transform:scale(.9); opacity:.7; } 100% { transform:scale(1.35); opacity:0; } }
  .ring img, .ring .init { width:100%; height:100%; border-radius:50%; border:3px solid var(--bg); object-fit:cover; display:grid; place-items:center; background:var(--glass); font-size:44px; font-weight:900; }
  h1 { font-size:28px; line-height:1.1; margin:14px 0 2px; font-weight:900; font-style:italic; }
  [data-theme="girly"] h1 { font-style:normal; }
  .handle { color:var(--muted); font-size:14px; }
  .bio { margin:10px auto 0; max-width:36ch; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .chip { padding:5px 11px; border-radius:99px; font-size:12.5px; font-weight:700; border:1px solid var(--line); background:var(--glass); }
  .amts { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:22px 0 12px; }
  .amt { height:50px; border-radius:16px; border:1px solid var(--line); background:var(--glass); color:var(--text); font-weight:800; font-size:15px; transition:transform .15s; }
  .amt:active { transform:scale(.92); }
  .amt.on { border-color:transparent; color:#fff; box-shadow:0 0 18px var(--a1); background:linear-gradient(118deg,var(--a2),var(--a1) 48%,var(--a3)); }
  #custom { display:none; width:100%; height:52px; border-radius:16px; border:1.5px solid var(--a1); background:var(--glass); color:var(--text); font-size:20px; font-weight:800; padding:0 16px; margin-bottom:12px; }
  .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:54px; border-radius:99px; border:1px solid var(--line); background:var(--glass); color:var(--text); font-weight:800; font-size:15.5px; text-decoration:none; margin-bottom:10px; padding:0 18px; transition:transform .15s; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .btn:active { transform:scale(.97); }
  .btn.primary { border-color:transparent; color:#fff; box-shadow:0 0 18px var(--a1),0 0 40px var(--a3); background:linear-gradient(118deg,var(--a2),var(--a1) 48%,var(--a3)); }
  .card { border:1px solid var(--line); background:var(--glass); border-radius:20px; padding:16px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 10px 30px var(--shadow); }
  .muted { color:var(--muted); font-size:13px; }
  .socials { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0; }
  .soc { width:auto; min-height:44px; padding:0 16px; margin:0; font-size:13.5px; }
  h2 { font-size:16px; margin:24px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .grid img, .grid video { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--glass); }
  footer { text-align:center; margin-top:28px; }
  #rain { position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .bill { position:absolute; top:-40px; width:46px; height:24px; border-radius:5px; background:linear-gradient(90deg,#39d98a,#15915a); color:#fff; font-weight:900; font-size:14px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.5); animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(540deg); } }
  #thanks { position:fixed; inset:0; z-index:6; display:none; place-items:center; background:rgba(0,0,0,.6); padding:24px; }
  #thanks .card { max-width:360px; text-align:center; padding:26px; }
  #thanks h3 { font-size:24px; margin:14px 0 8px; font-weight:900; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .heart { width:76px; height:76px; border-radius:50%; margin:0 auto; display:grid; place-items:center; font-size:36px; color:#fff; box-shadow:0 0 24px var(--a1); }
  .state { text-align:center; padding:80px 10px; }
  @media (prefers-reduced-motion: reduce) { .ring::after, .bill { animation:none; } }
</style>
</head>
<body>
<div id="rain" aria-hidden="true"></div>
<main>
  <div class="top"><div class="brand">NIPTIPS</div><button class="sw" id="sw" aria-label="Switch theme">Girly</button></div>
  <div id="app"><div class="state muted">Loading…</div></div>
  <footer class="muted">Tips go straight to her. NipTips takes no cut.</footer>
</main>
<div id="thanks" role="dialog" aria-modal="true"><div class="card">
  <div class="heart grad">♥</div>
  <h3 class="grad">You just made her night</h3>
  <p id="thanksText" style="margin:0 0 18px"></p>
  <button class="btn primary" id="thanksClose" style="margin:0">Done</button>
</div></div>
<script>
(function () {
  const SUPABASE_URL = 'https://jtqlkpiggmzvpcyjjhwd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_klTPF2ZiLYzHqOsehCIQlA__wMG_176';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : null);

  // Theme: remembers her choice on this phone.
  const root = document.documentElement, sw = $('sw');
  const setTheme = (t) => { root.dataset.theme = t; sw.textContent = t === 'girly' ? 'Baddie' : 'Girly'; document.querySelector('meta[name=theme-color]').content = t === 'girly' ? '#fdeef4' : '#070509'; try { localStorage.setItem('niptip_theme', t); } catch (e) {} };
  try { if (localStorage.getItem('niptip_theme') === 'girly') setTheme('girly'); } catch (e) {}
  sw.onclick = () => setTheme(root.dataset.theme === 'girly' ? 'baddie' : 'girly');

  const PAY = { cashApp: 'Cash App', venmo: 'Venmo', paypal: 'PayPal', wise: 'Wise' };
  const SOCIAL = { instagram: 'Instagram', tiktok: 'TikTok', snapchat: 'Snapchat', x: 'X', youtube: 'YouTube' };
  const PREFIX = { cashApp: 'https://cash.app/$', venmo: 'https://venmo.com/', paypal: 'https://paypal.me/', wise: 'https://wise.com/pay/me/', instagram: 'https://instagram.com/', tiktok: 'https://tiktok.com/@', snapchat: 'https://snapchat.com/add/', x: 'https://x.com/', youtube: 'https://youtube.com/@' };
  function linkUrl(l) {
    if (safeUrl(l.url)) return l.url;
    const v = String(l.value || '').trim();
    if (!v) return null;
    if (safeUrl(v)) return v;
    return PREFIX[l.type] ? PREFIX[l.type] + encodeURIComponent(v.replace(/^[@$]/, '')) : safeUrl('https://' + v);
  }
  function payUrl(l, amount) {
    const u = (linkUrl(l) || '').replace(/\/+$/, '');
    if (l.type === 'cashApp' || l.type === 'paypal') return u + '/' + amount;
    if (l.type === 'venmo') return u + '?txn=pay&amount=' + amount;
    return u;
  }

  let amount = 10, pending = null;

  function render(p, posts) {
    const name = p.display_name || p.username;
    const links = (Array.isArray(p.payment_links) ? p.payment_links : []).filter((l) => l && !l.hidden);
    const pay = links.filter((l) => PAY[l.type]);
    const social = links.filter((l) => SOCIAL[l.type]);
    const web = links.filter((l) => !PAY[l.type] && !SOCIAL[l.type] && linkUrl(l));
    const talents = Array.isArray(p.talents) ? p.talents.slice(0, 5) : [];
    document.title = name + ' · NipTips';
    const photo = safeUrl(p.photo_url), banner = safeUrl(p.banner_url);
    let h = '';
    h += '<div class="banner' + (banner ? '' : ' grad') + '"' + (banner ? ' style="background-image:url(\'' + esc(banner) + '\')"' : '') + '></div>';
    h += '<div class="hero"><div class="ring grad">' + (photo ? '<img src="' + esc(photo) + '" alt="">' : '<div class="init">' + esc(p.username.charAt(0).toUpperCase()) + '</div>') + '</div>';
    h += '<h1>' + esc(name) + '</h1><div class="handle">@' + esc(p.username) + '</div>';
    if (p.bio) h += '<p class="bio">' + esc(p.bio) + '</p>';
    if (talents.length) h += '<div class="chips">' + talents.map((t) => '<span class="chip">' + esc(t) + '</span>').join('') + '</div>';
    h += '</div>';
    if (pay.length) {
      h += '<div class="amts">' + [5, 10, 20, 50].map((a) => '<button class="amt' + (a === amount ? ' on' : '') + '" data-a="' + a + '">$' + a + '</button>').join('') + '<button class="amt" data-a="other">Other</button></div>';
      h += '<input id="custom" type="number" inputmode="numeric" min="1" max="9999" placeholder="Your amount" aria-label="Your amount">';
      h += pay.map((l, i) => '<button class="btn pay' + (i === 0 ? ' primary' : '') + '" data-i="' + i + '">Tip <span class="amtLabel">$' + amount + '</span> with ' + esc(l.label || PAY[l.type]) + '</button>').join('');
      h += '<button class="btn" id="rainBtn">Make It Rain</button>';
    } else {
      h += '<div class="card muted" style="margin-top:22px;text-align:center">She hasn\'t added a way to tip yet.</div>';
    }
    if (social.length) h += '<div class="socials">' + social.map((l) => '<a class="btn soc" rel="noopener" target="_blank" href="' + esc(linkUrl(l)) + '">' + esc(SOCIAL[l.type]) + '</a>').join('') + '</div>';
    h += web.map((l) => '<a class="btn" rel="noopener" target="_blank" href="' + esc(linkUrl(l)) + '">' + esc(l.label || 'Link') + '</a>').join('');
    const media = posts.flatMap((x) => (x.image_urls || []).slice(0, 1)).filter(safeUrl).slice(0, 9);
    if (media.length) h += '<h2>Posts</h2><div class="grid">' + media.map((u) => (/\.(mp4|mov|webm)(\?|$)/i.test(u) ? '<video src="' + esc(u) + '" muted loop playsinline autoplay></video>' : '<img loading="lazy" src="' + esc(u) + '" alt="">')).join('') + '</div>';
    $('app').innerHTML = h;

    const setAmount = (a) => { amount = a; document.querySelectorAll('.amtLabel').forEach((e) => { e.textContent = '$' + a; }); };
    document.querySelectorAll('.amt').forEach((b) => { b.onclick = () => {
      document.querySelectorAll('.amt').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      const c = $('custom');
      if (b.dataset.a === 'other') { c.style.display = 'block'; c.focus(); } else { c.style.display = 'none'; setAmount(+b.dataset.a); }
      if (navigator.vibrate) navigator.vibrate(12);
    }; });
    const c = $('custom');
    if (c) c.oninput = () => setAmount(Math.max(1, Math.min(9999, parseInt(c.value, 10) || 1)));
    document.querySelectorAll('.pay').forEach((b) => { b.onclick = () => {
      const l = pay[+b.dataset.i];
      pending = { amount: amount, app: l.label || PAY[l.type], name: p.username };
      if (navigator.vibrate) navigator.vibrate(30);
      window.location.href = payUrl(l, amount);
    }; });
    const rb = $('rainBtn');
    if (rb) rb.onclick = rain;
  }

  function rain() {
    if (navigator.vibrate) navigator.vibrate([60, 50, 40, 40, 90]);
    const box = $('rain');
    for (let i = 0; i < 44; i++) {
      const b = document.createElement('div');
      b.className = 'bill'; b.textContent = '$';
      b.style.left = Math.random() * 100 + 'vw';
      b.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
      b.style.animationDelay = Math.random() * 0.9 + 's';
      box.appendChild(b);
      setTimeout(() => b.remove(), 4800);
    }
  }

  // Back from the payment app: say thank you.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !pending) return;
    $('thanksText').textContent = 'Finish the $' + pending.amount + ' tip to @' + pending.name + ' in ' + pending.app + " if you haven't yet. It goes straight to her.";
    $('thanks').style.display = 'grid';
    pending = null;
    rain();
  });
  $('thanksClose').onclick = () => { $('thanks').style.display = 'none'; };

  const state = (t) => { $('app').innerHTML = '<div class="state"><h1>' + esc(t) + '</h1><p class="muted">Check the link and try again.</p></div>'; };

  async function main() {
    const username = (new URLSearchParams(window.location.search).get('u') || '').trim().replace(/^@/, '');
    if (!username) return state('NipTips');
    if (!/^[A-Za-z0-9._]{1,30}$/.test(username)) return state('Profile not found');
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    try {
      // Exact match first, then ignore capitals. "_" is escaped so it is not treated as a wildcard.
      let r = await db.from('profiles').select('*').eq('username', username).limit(1);
      let p = r.data && r.data[0];
      if (!p) {
        r = await db.from('profiles').select('*').ilike('username', username.replace(/_/g, '\\_')).limit(2);
        p = r.data && r.data.length === 1 ? r.data[0] : null;
      }
      if (!p) return state('Profile not found');
      const posts = await db.from('center_stage_posts').select('image_urls, created_at').eq('user_id', p.id).eq('feed_type', 'public').order('created_at', { ascending: false }).limit(12);
      render(p, posts.data || []);
      db.rpc('increment_profile_taps', { profile_username: p.username }).then(() => {}, () => {});
    } catch (e) {
      $('app').innerHTML = '<div class="state"><h1>Something went wrong</h1><p class="muted">Please refresh.</p></div>';
    }
  }
  main();
})();
</script>
</body>
</html>
